name: self-test

# Self-test for the reusable workflows in this repository.
#
# Every reusable workflow exposes the same interface (inputs: mode, scan-path,
# upload-sarif, artifact-name; outputs: blocking-count, total-count). Each layer
# is exercised against two fixture sets, always with `mode: report` so a finding
# never fails the call itself:
#
#   fixtures/vulnerable/<layer>  -> must produce blocking-count >= 1
#   fixtures/clean/<layer>       -> must produce blocking-count == 0
#
# To add a layer (for example `iac`):
#   1. Add fixtures under fixtures/vulnerable/iac and fixtures/clean/iac.
#   2. Copy the two `call-<layer>-*` jobs below and change `uses:` and `scan-path`.
#   3. Copy the `assert-<layer>` job, point `needs:` at the new call jobs and
#      adjust the output references.
#   4. Add a `check_layer` call (and `check_validate`) to the `test-scripts` job.
#
# Naming: call-<layer>-<case> calls the workflow, assert-<layer> checks outputs.
#
# Common interface rules every layer must follow (so calls never collide):
#   - `artifact-name` input (default `<layer>-report`): each call in this file
#     passes a distinct name (`<layer>-report-vulnerable`, `<layer>-report-clean`),
#     because upload-artifact rejects duplicate names within one run.
#   - Fixture scans must not pick up this repository's own scanner config:
#     pass the layer's config opt-out (secrets: `config-path: none`,
#     sca: `ignore-path: none`).
#   - Every caller job grants `contents: read` and `security-events: write`.
#
# The `test-scripts` job covers what the fixtures cannot: failure paths of the
# validate/parse/enforce scripts (invalid paths, missing report, invalid report,
# enforce vs report). Add equivalent assertions when a new layer introduces its
# own scripts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- secrets
  call-secrets-vulnerable:
    # security-events: write is required because the called workflow declares it
    # (used only when upload-sarif is true).
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/secrets.yml
    with:
      mode: report
      scan-path: fixtures/vulnerable/secrets
      artifact-name: secrets-report-vulnerable
      config-path: none

  call-secrets-clean:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/secrets.yml
    with:
      mode: report
      scan-path: fixtures/clean/secrets
      artifact-name: secrets-report-clean
      config-path: none

  assert-secrets:
    needs: [call-secrets-vulnerable, call-secrets-clean]
    runs-on: ubuntu-latest
    env:
      VULNERABLE_BLOCKING: ${{ needs.call-secrets-vulnerable.outputs.blocking-count }}
      CLEAN_BLOCKING: ${{ needs.call-secrets-clean.outputs.blocking-count }}
    steps:
      - name: Assert expected counts
        run: |
          set -euo pipefail
          fail=0
          echo "vulnerable blocking-count: '$VULNERABLE_BLOCKING' (expected >= 1)"
          echo "clean blocking-count:      '$CLEAN_BLOCKING' (expected 0)"
          case "$VULNERABLE_BLOCKING" in ''|*[!0-9]*) echo "::error::vulnerable blocking-count is not numeric"; fail=1 ;;
            *) [ "$VULNERABLE_BLOCKING" -ge 1 ] || { echo "::error::Gitleaks found nothing in the vulnerable fixture (false green)"; fail=1; } ;;
          esac
          case "$CLEAN_BLOCKING" in ''|*[!0-9]*) echo "::error::clean blocking-count is not numeric"; fail=1 ;;
            *) [ "$CLEAN_BLOCKING" -eq 0 ] || { echo "::error::Gitleaks reported findings in the clean fixture"; fail=1; } ;;
          esac
          exit "$fail"

  # -------------------------------------------------------------------- sca
  call-sca-vulnerable:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/sca.yml
    with:
      mode: report
      scan-path: fixtures/vulnerable/sca
      artifact-name: sca-report-vulnerable
      ignore-path: none

  call-sca-clean:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/sca.yml
    with:
      mode: report
      scan-path: fixtures/clean/sca
      artifact-name: sca-report-clean
      ignore-path: none

  assert-sca:
    needs: [call-sca-vulnerable, call-sca-clean]
    runs-on: ubuntu-latest
    env:
      VULNERABLE_BLOCKING: ${{ needs.call-sca-vulnerable.outputs.blocking-count }}
      CLEAN_BLOCKING: ${{ needs.call-sca-clean.outputs.blocking-count }}
    steps:
      - name: Assert expected counts
        run: |
          set -euo pipefail
          fail=0
          echo "vulnerable blocking-count: '$VULNERABLE_BLOCKING' (expected >= 1)"
          echo "clean blocking-count:      '$CLEAN_BLOCKING' (expected 0)"
          case "$VULNERABLE_BLOCKING" in ''|*[!0-9]*) echo "::error::vulnerable blocking-count is not numeric"; fail=1 ;;
            *) [ "$VULNERABLE_BLOCKING" -ge 1 ] || { echo "::error::Trivy found nothing in the vulnerable fixture (false green)"; fail=1; } ;;
          esac
          case "$CLEAN_BLOCKING" in ''|*[!0-9]*) echo "::error::clean blocking-count is not numeric"; fail=1 ;;
            *) [ "$CLEAN_BLOCKING" -eq 0 ] || { echo "::error::Trivy reported findings in the clean fixture"; fail=1; } ;;
          esac
          exit "$fail"

  # ------------------------------------------------------------------- sast
  call-sast-vulnerable:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/sast.yml
    with:
      mode: report
      scan-path: fixtures/vulnerable/sast
      artifact-name: sast-report-vulnerable

  call-sast-clean:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/sast.yml
    with:
      mode: report
      scan-path: fixtures/clean/sast
      artifact-name: sast-report-clean

  assert-sast:
    needs: [call-sast-vulnerable, call-sast-clean]
    runs-on: ubuntu-latest
    env:
      VULNERABLE_BLOCKING: ${{ needs.call-sast-vulnerable.outputs.blocking-count }}
      CLEAN_BLOCKING: ${{ needs.call-sast-clean.outputs.blocking-count }}
    steps:
      - name: Assert expected counts
        run: |
          set -euo pipefail
          fail=0
          echo "vulnerable blocking-count: '$VULNERABLE_BLOCKING' (expected >= 1)"
          echo "clean blocking-count:      '$CLEAN_BLOCKING' (expected 0)"
          case "$VULNERABLE_BLOCKING" in ''|*[!0-9]*) echo "::error::vulnerable blocking-count is not numeric"; fail=1 ;;
            *) [ "$VULNERABLE_BLOCKING" -ge 1 ] || { echo "::error::Semgrep found nothing in the vulnerable fixture (false green)"; fail=1; } ;;
          esac
          case "$CLEAN_BLOCKING" in ''|*[!0-9]*) echo "::error::clean blocking-count is not numeric"; fail=1 ;;
            *) [ "$CLEAN_BLOCKING" -eq 0 ] || { echo "::error::Semgrep reported findings in the clean fixture"; fail=1; } ;;
          esac
          exit "$fail"

  # -------------------------------------------------------------------- iac
  call-iac-vulnerable:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/iac.yml
    with:
      mode: report
      scan-path: fixtures/vulnerable/iac
      artifact-name: iac-report-vulnerable
      ignore-path: none

  call-iac-clean:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/iac.yml
    with:
      mode: report
      scan-path: fixtures/clean/iac
      artifact-name: iac-report-clean
      ignore-path: none

  assert-iac:
    needs: [call-iac-vulnerable, call-iac-clean]
    runs-on: ubuntu-latest
    env:
      VULNERABLE_BLOCKING: ${{ needs.call-iac-vulnerable.outputs.blocking-count }}
      CLEAN_BLOCKING: ${{ needs.call-iac-clean.outputs.blocking-count }}
    steps:
      - name: Assert expected counts
        run: |
          set -euo pipefail
          fail=0
          echo "vulnerable blocking-count: '$VULNERABLE_BLOCKING' (expected >= 1)"
          echo "clean blocking-count:      '$CLEAN_BLOCKING' (expected 0)"
          case "$VULNERABLE_BLOCKING" in ''|*[!0-9]*) echo "::error::vulnerable blocking-count is not numeric"; fail=1 ;;
            *) [ "$VULNERABLE_BLOCKING" -ge 1 ] || { echo "::error::Trivy found nothing in the vulnerable fixture (false green)"; fail=1; } ;;
          esac
          case "$CLEAN_BLOCKING" in ''|*[!0-9]*) echo "::error::clean blocking-count is not numeric"; fail=1 ;;
            *) [ "$CLEAN_BLOCKING" -eq 0 ] || { echo "::error::Trivy reported findings in the clean fixture"; fail=1; } ;;
          esac
          exit "$fail"

  # ------------------------------------------------------------------ image
  call-image-vulnerable:
    permissions:
      contents: read
      security-events: write
      packages: write
    uses: ./.github/workflows/image-scan.yml
    with:
      mode: report
      context: fixtures/vulnerable/image
      image-name: fixture-vulnerable
      artifact-name: image-report-vulnerable
      ignore-path: none

  call-image-clean:
    permissions:
      contents: read
      security-events: write
      packages: write
    uses: ./.github/workflows/image-scan.yml
    with:
      mode: report
      context: fixtures/clean/image
      image-name: fixture-clean
      artifact-name: image-report-clean
      ignore-path: none

  assert-image:
    needs: [call-image-vulnerable, call-image-clean]
    runs-on: ubuntu-latest
    env:
      VULNERABLE_BLOCKING: ${{ needs.call-image-vulnerable.outputs.blocking-count }}
      CLEAN_BLOCKING: ${{ needs.call-image-clean.outputs.blocking-count }}
    steps:
      - name: Assert expected counts
        run: |
          set -euo pipefail
          fail=0
          echo "vulnerable blocking-count: '$VULNERABLE_BLOCKING' (expected >= 1)"
          echo "clean blocking-count:      '$CLEAN_BLOCKING' (expected 0)"
          case "$VULNERABLE_BLOCKING" in ''|*[!0-9]*) echo "::error::vulnerable blocking-count is not numeric"; fail=1 ;;
            *) [ "$VULNERABLE_BLOCKING" -ge 1 ] || { echo "::error::Trivy found nothing in the vulnerable image (false green)"; fail=1; } ;;
          esac
          case "$CLEAN_BLOCKING" in ''|*[!0-9]*) echo "::error::clean blocking-count is not numeric"; fail=1 ;;
            *) [ "$CLEAN_BLOCKING" -eq 0 ] || { echo "::error::Trivy reported blocking findings in the clean image"; fail=1; } ;;
          esac
          exit "$fail"

  # Failure-path tests for the scripts embedded in each reusable workflow. The
  # scripts are extracted by step id and run with simulated inputs.
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test validate, parse and enforce scripts
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          failures=0

          # extract <workflow-file> <job-id> <step-id> -> $work/<job-id>-<step-id>.sh
          extract() {
            local out="$work/$2-$3.sh"
            yq ".jobs.$2.steps[] | select(.id == \"$3\") | .run" ".github/workflows/$1" > "$out"
            [ -s "$out" ] || { echo "::error::step '$3' not found in $1"; exit 1; }
          }
          # expect <yes|no: should the command exit 0> <description> <command...>
          expect() {
            want="$1"; desc="$2"; shift 2
            if "$@" > "$work/out.log" 2>&1; then got=yes; else got=no; fi
            if [ "$got" = "$want" ]; then
              echo "ok   - $desc"
            else
              echo "::error::FAIL - $desc (exit-zero expected: $want)"; cat "$work/out.log"
              failures=$((failures + 1))
            fi
          }
          # expect_line <file> <line> <description>
          expect_line() {
            if grep -qx "$2" "$1"; then
              echo "ok   - $3"
            else
              echo "::error::FAIL - $3 (expected '$2' in $1)"; cat "$1" 2>/dev/null || true
              failures=$((failures + 1))
            fi
          }

          # check_layer <workflow-file> <job-id> <report-dir> <report-file> <invalid-json>
          #             <valid-empty-json> <findings-json> <expected-blocking> <expected-total>
          check_layer() {
            local wf="$1" job="$2" dir="$3" file="$4" invalid="$5" empty="$6" findings="$7" eb="$8" et="$9"
            local base="$work/$job"
            extract "$wf" "$job" parse
            extract "$wf" "$job" enforce
            local parse="$work/$job-parse.sh" enforce="$work/$job-enforce.sh"

            # (a) report missing -> parse must fail (no false green)
            mkdir -p "$base/a"
            expect no "$job: parse fails when the report is missing" \
              env RUNNER_TEMP="$base/a" GITHUB_OUTPUT="$base/a.out" bash "$parse"

            # (b) report is not valid for the tool -> parse must fail
            mkdir -p "$base/b/$dir"; echo "$invalid" > "$base/b/$dir/$file"
            expect no "$job: parse fails when the report is invalid" \
              env RUNNER_TEMP="$base/b" GITHUB_OUTPUT="$base/b.out" bash "$parse"

            # sanity: a valid empty report parses to zero findings
            mkdir -p "$base/ok/$dir"; echo "$empty" > "$base/ok/$dir/$file"
            expect yes "$job: parse succeeds on a valid empty report" \
              env RUNNER_TEMP="$base/ok" GITHUB_OUTPUT="$base/ok.out" bash "$parse"
            expect_line "$base/ok.out" "blocking-count=0" "$job: empty report -> blocking-count=0"

            # report with findings: counts follow the blocking policy
            mkdir -p "$base/f/$dir"; echo "$findings" > "$base/f/$dir/$file"
            expect yes "$job: parse succeeds on a report with findings" \
              env RUNNER_TEMP="$base/f" GITHUB_OUTPUT="$base/f.out" bash "$parse"
            expect_line "$base/f.out" "blocking-count=$eb" "$job: findings report -> blocking-count=$eb"
            expect_line "$base/f.out" "total-count=$et" "$job: findings report -> total-count=$et"

            # (c) enforce with findings -> must fail; (d) report mode / no findings -> must pass
            expect no  "$job: enforce fails in enforce mode with blocking findings" \
              env MODE=enforce BLOCKING=2 bash "$enforce"
            expect yes "$job: enforce passes in report mode with blocking findings" \
              env MODE=report BLOCKING=2 bash "$enforce"
            expect yes "$job: enforce passes in enforce mode without findings" \
              env MODE=enforce BLOCKING=0 bash "$enforce"
          }

          # check_validate <workflow-file> <job-id> <extra-env...>: mode and scan-path validation
          check_validate() {
            local wf="$1" job="$2"; shift 2
            extract "$wf" "$job" validate
            local script="$work/$job-validate.sh"
            expect yes "$job: validate accepts the defaults" env MODE=report SCAN_PATH=. "$@" bash "$script"
            expect no  "$job: validate rejects an invalid mode" env MODE=bogus SCAN_PATH=. "$@" bash "$script"
            expect no  "$job: validate rejects an absolute scan-path" env MODE=report SCAN_PATH=/etc "$@" bash "$script"
            expect no  "$job: validate rejects a scan-path with '..'" env MODE=report SCAN_PATH=../x "$@" bash "$script"
            expect no  "$job: validate rejects an empty scan-path" env MODE=report SCAN_PATH= "$@" bash "$script"
          }

          # ------------------------------------------------------------ secrets
          check_layer secrets.yml gitleaks gitleaks-out gitleaks.json \
            '{"error": true}' '[]' '[{"RuleID":"a"},{"RuleID":"b"}]' 2 2
          check_validate secrets.yml gitleaks CONFIG_PATH=
          expect no  "gitleaks: validate rejects an absolute config-path" \
            env MODE=report SCAN_PATH=. CONFIG_PATH=/etc/x.toml bash "$work/gitleaks-validate.sh"
          expect no  "gitleaks: validate rejects a config-path with '..'" \
            env MODE=report SCAN_PATH=. CONFIG_PATH=../x.toml bash "$work/gitleaks-validate.sh"
          expect yes "gitleaks: validate accepts config-path 'none'" \
            env MODE=report SCAN_PATH=. CONFIG_PATH=none bash "$work/gitleaks-validate.sh"

          # ---------------------------------------------------------------- sca
          # 3 vulns: HIGH with fix (blocking), HIGH without fix, LOW with fix.
          sca_findings='{"SchemaVersion":2,"Results":[{"Target":"pnpm-lock.yaml","Vulnerabilities":[
            {"VulnerabilityID":"CVE-1","Severity":"HIGH","FixedVersion":"1.0.1","PkgName":"a","InstalledVersion":"1.0.0"},
            {"VulnerabilityID":"CVE-2","Severity":"HIGH","PkgName":"b","InstalledVersion":"1.0.0"},
            {"VulnerabilityID":"CVE-3","Severity":"LOW","FixedVersion":"2.0.0","PkgName":"c","InstalledVersion":"1.0.0"}]}]}'
          check_layer sca.yml trivy trivy-out trivy.json \
            '{"error": true}' '{"SchemaVersion":2}' "$sca_findings" 1 3
          check_validate sca.yml trivy IGNORE_PATH=
          expect no  "trivy: validate rejects an absolute ignore-path" \
            env MODE=report SCAN_PATH=. IGNORE_PATH=/etc/x bash "$work/trivy-validate.sh"
          expect no  "trivy: validate rejects an ignore-path with '..'" \
            env MODE=report SCAN_PATH=. IGNORE_PATH=../x bash "$work/trivy-validate.sh"

          # SARIF locations are made repository-relative (Trivy reports them
          # relative to the scan root and sets a bogus uriBaseId).
          extract sca.yml trivy sarif-paths
          sarif_sample='{"runs":[{"results":[{"locations":[{"physicalLocation":{"artifactLocation":{"uri":"pom.xml","uriBaseId":"ROOTPATH"}}}]}]}]}'
          i=0
          for tc in "backend:backend/pom.xml" "./backend/:backend/pom.xml" "a/b:a/b/pom.xml" ".:pom.xml"; do
            i=$((i + 1))
            sp="${tc%%:*}"; exp_uri="${tc#*:}"
            mkdir -p "$work/sp$i/trivy-out"
            echo "$sarif_sample" > "$work/sp$i/trivy-out/trivy.sarif"
            expect yes "trivy: sarif-paths runs for scan-path '$sp'" env RUNNER_TEMP="$work/sp$i" SCAN_PATH="$sp" bash "$work/trivy-sarif-paths.sh"
            got="$(jq -r '.runs[0].results[0].locations[0].physicalLocation.artifactLocation | .uri + (if has("uriBaseId") then " HAS-BASEID" else "" end)' "$work/sp$i/trivy-out/trivy.sarif")"
            if [ "$got" = "$exp_uri" ]; then echo "ok   - trivy: sarif uri for scan-path '$sp' is '$exp_uri'"; else echo "::error::FAIL - trivy: sarif uri for '$sp' is '$got', expected '$exp_uri'"; failures=$((failures + 1)); fi
          done

          # --------------------------------------------------------------- sast
          # 3 results: two ERROR (blocking), one WARNING.
          sast_findings='{"results":[
            {"check_id":"r1","path":"a.ts","start":{"line":1},"extra":{"severity":"ERROR","message":"m"}},
            {"check_id":"r2","path":"b.java","start":{"line":2},"extra":{"severity":"ERROR","message":"m"}},
            {"check_id":"r3","path":"c.ts","start":{"line":3},"extra":{"severity":"WARNING","message":"m"}}],"errors":[]}'
          check_layer sast.yml semgrep semgrep-out semgrep.json \
            '{"error": true}' '{"results":[],"errors":[]}' "$sast_findings" 2 3
          check_validate sast.yml semgrep RULESETS="p/typescript p/java"
          expect no  "semgrep: validate rejects empty rulesets" \
            env MODE=report SCAN_PATH=. RULESETS= bash "$work/semgrep-validate.sh"
          expect no  "semgrep: validate rejects rulesets with shell metacharacters" \
            env MODE=report SCAN_PATH=. RULESETS='p/java;id' bash "$work/semgrep-validate.sh"
          expect no  "semgrep: validate rejects a rulesets path with '..'" \
            env MODE=report SCAN_PATH=. RULESETS='../rules' bash "$work/semgrep-validate.sh"

          # Partial Semgrep results (.errors) must surface as a warning without failing.
          mkdir -p "$work/se/semgrep-out"
          echo '{"results":[],"errors":[{"type":"PartialParsing","message":"x"}]}' > "$work/se/semgrep-out/semgrep.json"
          expect yes "semgrep: parse succeeds on a report with errors" env RUNNER_TEMP="$work/se" GITHUB_OUTPUT="$work/se.out" bash "$work/semgrep-parse.sh"
          if grep -q '^::warning::Semgrep reported 1 error' "$work/out.log"; then echo "ok   - semgrep: parse warns on partial results"; else echo "::error::FAIL - semgrep: no warning for partial results"; cat "$work/out.log"; failures=$((failures + 1)); fi

          # ---------------------------------------------------------------- iac
          # 3 misconfigurations: HIGH, CRITICAL (blocking), LOW.
          iac_findings='{"SchemaVersion":2,"Results":[{"Target":"Dockerfile","Misconfigurations":[
            {"ID":"DS-0002","Severity":"HIGH","Title":"root user"},
            {"ID":"KSV-9999","Severity":"CRITICAL","Title":"t"},
            {"ID":"DS-0026","Severity":"LOW","Title":"no healthcheck"}]}]}'
          check_layer iac.yml trivy trivy-out trivy.json \
            '{"error": true}' '{"SchemaVersion":2}' "$iac_findings" 2 3
          check_validate iac.yml trivy IGNORE_PATH= HELM_CHART=
          expect no  "iac: validate rejects an absolute ignore-path" \
            env MODE=report SCAN_PATH=. IGNORE_PATH=/etc/x HELM_CHART= bash "$work/trivy-validate.sh"
          expect no  "iac: validate rejects an absolute helm-chart" \
            env MODE=report SCAN_PATH=. IGNORE_PATH= HELM_CHART=/etc/chart bash "$work/trivy-validate.sh"
          expect no  "iac: validate rejects a helm-chart with '..'" \
            env MODE=report SCAN_PATH=. IGNORE_PATH= HELM_CHART=../chart bash "$work/trivy-validate.sh"
          expect yes "iac: validate accepts a relative helm-chart" \
            env MODE=report SCAN_PATH=. IGNORE_PATH= HELM_CHART=deploy/chart bash "$work/trivy-validate.sh"

          # SARIF: the uriBaseId is dropped and absolute paths are refused.
          extract iac.yml trivy sarif-paths
          mkdir -p "$work/ip1/trivy-out" "$work/ip2/trivy-out"
          echo '{"runs":[{"results":[{"locations":[{"physicalLocation":{"artifactLocation":{"uri":"deploy/pod.yaml","uriBaseId":"ROOTPATH"}}}]}]}]}' > "$work/ip1/trivy-out/trivy.sarif"
          expect yes "iac: sarif-paths accepts repository-relative locations" env RUNNER_TEMP="$work/ip1" bash "$work/trivy-sarif-paths.sh"
          got="$(jq -r '.runs[0].results[0].locations[0].physicalLocation.artifactLocation | .uri + (if has("uriBaseId") then " HAS-BASEID" else "" end)' "$work/ip1/trivy-out/trivy.sarif")"
          if [ "$got" = "deploy/pod.yaml" ]; then echo "ok   - iac: sarif uri kept and uriBaseId removed"; else echo "::error::FAIL - iac: sarif uri is '$got'"; failures=$((failures + 1)); fi
          echo '{"runs":[{"results":[{"locations":[{"physicalLocation":{"artifactLocation":{"uri":"/tmp/x.yaml"}}}]}]}]}' > "$work/ip2/trivy-out/trivy.sarif"
          expect no "iac: sarif-paths refuses absolute locations" env RUNNER_TEMP="$work/ip2" bash "$work/trivy-sarif-paths.sh"

          # Helm chart handling in the iac scan, with fake docker/helm binaries that
          # record their arguments: the chart directory is skipped in the main scan
          # (no double count) and the ignore file reaches both scans.
          extract iac.yml trivy scan
          fake="$work/fake-iac"; mkdir -p "$fake"
          cat > "$fake/docker" <<'FAKE'
          #!/usr/bin/env bash
          echo "docker $*" >> "$FAKE_LOG"
          if [ "$1" = run ]; then
            args=("$@"); out=""; name=""
            for i in "${!args[@]}"; do
              if [ "${args[$i]}" = "-v" ]; then
                v="${args[$((i + 1))]}"
                case "$v" in *:/out) out="${v%:/out}" ;; esac
              fi
              if [ "${args[$i]}" = "--output" ]; then name="${args[$((i + 1))]##*/}"; fi
            done
            if [ -n "$out" ] && [ -n "$name" ]; then echo '{"SchemaVersion":2,"Results":[]}' > "$out/$name"; fi
          fi
          FAKE
          cat > "$fake/helm" <<'FAKE'
          #!/usr/bin/env bash
          while [ $# -gt 0 ]; do
            if [ "$1" = "--output-dir" ]; then mkdir -p "$2/x/templates"; fi
            shift
          done
          FAKE
          chmod +x "$fake/docker" "$fake/helm"
          mkdir -p "$work/iw/deploy/chart" "$work/iw/deploy/app"
          echo "name: x" > "$work/iw/deploy/chart/Chart.yaml"
          : > "$work/iw/.trivyignore"
          for variant in with-chart no-chart; do
            rt="$work/ir-$variant"; mkdir -p "$rt"; : > "$work/ir-$variant.log"
            chart=""; [ "$variant" = "with-chart" ] && chart="deploy/chart"
            expect yes "iac: scan step runs ($variant)" \
              env PATH="$fake:$PATH" FAKE_LOG="$work/ir-$variant.log" GITHUB_WORKSPACE="$work/iw" RUNNER_TEMP="$rt" \
                TRIVY_IMAGE=trivy:test SCAN_PATH=deploy IGNORE_PATH= HELM_CHART="$chart" SARIF_ENABLED=false bash "$work/trivy-scan.sh"
          done
          skips="$(grep -c -e '--skip-dirs /repo/deploy/chart' "$work/ir-with-chart.log" || true)"
          ignores="$(grep -c -e '--ignorefile /repo/.trivyignore' "$work/ir-with-chart.log" || true)"
          if [ "$skips" = 1 ]; then echo "ok   - iac: chart directory skipped once in the main scan"; else echo "::error::FAIL - iac: expected one --skip-dirs, got $skips"; failures=$((failures + 1)); fi
          if [ "$ignores" = 2 ]; then echo "ok   - iac: ignore file applied to the main and the helm scan"; else echo "::error::FAIL - iac: expected 2 --ignorefile, got $ignores"; failures=$((failures + 1)); fi
          if grep -q -e '--skip-dirs' "$work/ir-no-chart.log"; then echo "::error::FAIL - iac: --skip-dirs used without helm-chart"; failures=$((failures + 1)); else echo "ok   - iac: no --skip-dirs without helm-chart"; fi

          # -------------------------------------------------------------- image
          export PUSH=false PUSH_TAGS=
          # 3 vulns: HIGH with fix (blocking), CRITICAL without fix, LOW with fix.
          image_findings='{"SchemaVersion":2,"Results":[{"Target":"app (alpine 3.15)","Vulnerabilities":[
            {"VulnerabilityID":"CVE-1","Severity":"HIGH","FixedVersion":"1.0.1","PkgName":"a","InstalledVersion":"1.0.0"},
            {"VulnerabilityID":"CVE-2","Severity":"CRITICAL","PkgName":"b","InstalledVersion":"1.0.0"},
            {"VulnerabilityID":"CVE-3","Severity":"LOW","FixedVersion":"2.0.0","PkgName":"c","InstalledVersion":"1.0.0"}]}]}'
          check_layer image-scan.yml image trivy-out trivy.json \
            '{"error": true}' '{"SchemaVersion":2}' "$image_findings" 1 3
          check_validate image-scan.yml image IGNORE_PATH= CONTEXT= DOCKERFILE= IMAGE_NAME=my-app
          expect no  "image: validate rejects an absolute context" \
            env MODE=report SCAN_PATH=. IGNORE_PATH= CONTEXT=/etc DOCKERFILE= IMAGE_NAME=my-app bash "$work/image-validate.sh"
          expect no  "image: validate rejects a context with '..'" \
            env MODE=report SCAN_PATH=. IGNORE_PATH= CONTEXT=../x DOCKERFILE= IMAGE_NAME=my-app bash "$work/image-validate.sh"
          expect no  "image: validate rejects an absolute dockerfile" \
            env MODE=report SCAN_PATH=. IGNORE_PATH= CONTEXT= DOCKERFILE=/etc/passwd IMAGE_NAME=my-app bash "$work/image-validate.sh"
          expect no  "image: validate rejects a dockerfile with '..'" \
            env MODE=report SCAN_PATH=. IGNORE_PATH= CONTEXT= DOCKERFILE=../Dockerfile IMAGE_NAME=my-app bash "$work/image-validate.sh"
          for bad in "" "My-App" "app:tag" 'app;id' "-app" 'a b' "app/" "a..b" "a//b" "/a" "a-"; do
            expect no  "image: validate rejects image-name '$bad'" \
              env MODE=report SCAN_PATH=. IGNORE_PATH= CONTEXT= DOCKERFILE= IMAGE_NAME="$bad" bash "$work/image-validate.sh"
          done
          expect yes "image: validate accepts a registry-style image-name" \
            env MODE=report SCAN_PATH=. IGNORE_PATH= CONTEXT=backend DOCKERFILE=backend/Dockerfile IMAGE_NAME=org/my-app.v2 bash "$work/image-validate.sh"

          # push / push-tags validation.
          iv="$work/image-validate.sh"
          base_env=(MODE=report SCAN_PATH=. IGNORE_PATH= CONTEXT= DOCKERFILE= IMAGE_NAME=my-app)
          expect yes "image: validate accepts push=false with no tags" env "${base_env[@]}" PUSH=false PUSH_TAGS= bash "$iv"
          expect no  "image: validate rejects push=true without tags" env "${base_env[@]}" PUSH=true PUSH_TAGS= bash "$iv"
          expect no  "image: validate rejects push=true with only blank tags" env "${base_env[@]}" PUSH=true PUSH_TAGS=$'\n  \n' bash "$iv"
          expect no  "image: validate rejects an invalid push value" env "${base_env[@]}" PUSH=maybe PUSH_TAGS= bash "$iv"
          expect yes "image: validate accepts several valid push-tags" \
            env "${base_env[@]}" PUSH=true PUSH_TAGS=$'ghcr.io/owner/my-app:latest\nghcr.io/owner/my-app:sha-0123abc\n\nlocalhost:5000/team/app:1.2.3\n' bash "$iv"
          for bad in "ghcr.io/Owner/app:latest" "ghcr.io/owner/app" "ghcr.io/owner/app:" "app:latest" 'ghcr.io/owner/app:t;id' 'ghcr.io/owner/app:a b' "ghcr.io//app:t" "ghcr.io/owner/app/:t" "ghcr.io/owner/../app:t" "https://ghcr.io/owner/app:t" "ghcr.io/owner/app@sha256:abc"; do
            expect no "image: validate rejects push-tag '$bad'" \
              env "${base_env[@]}" PUSH=true PUSH_TAGS=$'ghcr.io/owner/ok:latest\n'"$bad" bash "$iv"
          done

          # Push step with a fake docker: the scanned image is tagged and pushed only
          # when the policy allows it, and only if its ID is unchanged.
          extract image-scan.yml image push
          fake="$work/fake-push"; mkdir -p "$fake"
          cat > "$fake/docker" <<'FAKE'
          #!/usr/bin/env bash
          echo "docker $*" >> "$FAKE_LOG"
          case "$1" in
            inspect) echo "${FAKE_ID:-sha256:1111}" ;;
            push) echo "latest: digest: sha256:$(printf 'b%.0s' $(seq 1 64)) size: 528" ;;
          esac
          FAKE
          chmod +x "$fake/docker"
          push_tags=$'ghcr.io/owner/my-app:latest\nghcr.io/owner/my-app:sha-abc'
          # shellcheck disable=SC2329 # invoked through expect
          run_push() { # <name> <mode> <blocking> <current-id>
            mkdir -p "$work/p-$1"; : > "$work/p-$1.log"; : > "$work/p-$1.out"
            env PATH="$fake:$PATH" FAKE_LOG="$work/p-$1.log" FAKE_ID="$4" RUNNER_TEMP="$work/p-$1" GITHUB_OUTPUT="$work/p-$1.out" \
              MODE="$2" BLOCKING="$3" IMAGE_ID=sha256:1111 IMAGE_NAME=my-app PUSH_TAGS="$push_tags" bash "$work/image-push.sh"
          }
          expect yes "image: push step succeeds when nothing blocks" run_push ok enforce 0 sha256:1111
          pushes="$(grep -c '^docker push ' "$work/p-ok.log" || true)"
          tags_made="$(grep -c '^docker tag my-app:scan ghcr.io/owner/my-app:' "$work/p-ok.log" || true)"
          if [ "$pushes" = 2 ] && [ "$tags_made" = 2 ]; then echo "ok   - image: every push-tag is tagged from the scanned image and pushed"; else echo "::error::FAIL - image: tags=$tags_made pushes=$pushes (expected 2/2)"; failures=$((failures + 1)); fi
          expect_line "$work/p-ok.out" "digest=sha256:$(printf 'b%.0s' $(seq 1 64))" "image: push step outputs the pushed digest"
          expect yes "image: push step skips (exit 0) when enforce has blocking findings" run_push blocked enforce 2 sha256:1111
          if grep -q '^docker push ' "$work/p-blocked.log"; then echo "::error::FAIL - image: pushed despite blocking findings in enforce mode"; failures=$((failures + 1)); else echo "ok   - image: no push when enforce blocks"; fi
          expect_line "$work/p-blocked.out" "digest=" "image: blocked run has an empty digest"
          expect yes "image: push step still pushes in report mode with findings" run_push report report 2 sha256:1111
          if grep -q '^docker push ' "$work/p-report.log"; then echo "ok   - image: report mode pushes regardless of findings"; else echo "::error::FAIL - image: report mode did not push"; failures=$((failures + 1)); fi
          expect no  "image: push step refuses when the image ID changed" run_push changed enforce 0 sha256:2222
          if grep -q '^docker push ' "$work/p-changed.log"; then echo "::error::FAIL - image: pushed an image whose ID changed"; failures=$((failures + 1)); else echo "ok   - image: no push when the ID changed"; fi
          # The step is only reached after the policy step succeeded and when push is requested.
          push_if="$(yq '.jobs.image.steps[] | select(.id == "push") | .if' .github/workflows/image-scan.yml)"
          case "$push_if" in
            *"steps.enforce.outcome == 'success'"*"inputs.push"*|*"inputs.push"*"steps.enforce.outcome == 'success'"*) echo "ok   - image: push step is gated on inputs.push and a successful enforce step" ;;
            *) echo "::error::FAIL - image: push step is not gated on enforce success: $push_if"; failures=$((failures + 1)) ;;
          esac

          # Build input resolution: context falls back to scan-path; the
          # Dockerfile defaults to <context>/Dockerfile.
          extract image-scan.yml image resolve
          for tc in "|.||.|Dockerfile" "|backend||backend|backend/Dockerfile" "|./backend/||backend|backend/Dockerfile" "svc|.||svc|svc/Dockerfile" "svc|.|./ops/Dockerfile|svc|ops/Dockerfile"; do
            IFS='|' read -r c sp d ec ed <<< "$tc"
            : > "$work/res.out"
            env CONTEXT="$c" SCAN_PATH="$sp" DOCKERFILE="$d" GITHUB_OUTPUT="$work/res.out" bash "$work/image-resolve.sh"
            expect_line "$work/res.out" "context=$ec" "image: resolve (context '$c', scan-path '$sp') -> context=$ec"
            expect_line "$work/res.out" "dockerfile=$ed" "image: resolve (context '$c', dockerfile '$d') -> dockerfile=$ed"
          done

          # SARIF: every alert is attached to the Dockerfile.
          extract image-scan.yml image sarif-paths
          mkdir -p "$work/is/trivy-out"
          echo '{"runs":[{"results":[{"ruleId":"CVE-1","locations":[{"physicalLocation":{"artifactLocation":{"uri":"library/node","uriBaseId":"ROOTPATH"}}}]},{"ruleId":"CVE-2"}]}]}' > "$work/is/trivy-out/trivy.sarif"
          expect yes "image: sarif-paths runs" env RUNNER_TEMP="$work/is" RESOLVED_DOCKERFILE=svc/Dockerfile bash "$work/image-sarif-paths.sh"
          got="$(jq -c '[.runs[0].results[] | .locations[0].physicalLocation.artifactLocation]' "$work/is/trivy-out/trivy.sarif")"
          if [ "$got" = '[{"uri":"svc/Dockerfile"},{"uri":"svc/Dockerfile"}]' ]; then echo "ok   - image: sarif locations point at the Dockerfile"; else echo "::error::FAIL - image: sarif locations are $got"; failures=$((failures + 1)); fi

          exit "$failures"
