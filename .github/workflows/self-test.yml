name: self-test

# Self-test for the reusable workflows in this repository.
#
# Every reusable workflow exposes the same interface (inputs: mode, scan-path,
# upload-sarif; outputs: blocking-count, total-count). Each layer is exercised
# against two fixture sets, always with `mode: report` so a finding never fails
# the call itself:
#
#   fixtures/vulnerable/<layer>  -> must produce blocking-count >= 1
#   fixtures/clean/<layer>       -> must produce blocking-count == 0
#
# To add a layer (for example `sca`):
#   1. Add fixtures under fixtures/vulnerable/sca and fixtures/clean/sca.
#   2. Copy the two `call-<layer>-*` jobs below and change `uses:` and `scan-path`.
#   3. Copy the `assert-<layer>` job, point `needs:` at the new call jobs and
#      adjust the output references.
#
# Naming: call-<layer>-<case> calls the workflow, assert-<layer> checks outputs.
#
# Common interface rules every layer must follow (so calls never collide):
#   - `artifact-name` input (default `<layer>-report`): each call in this file
#     passes a distinct name (`<layer>-report-vulnerable`, `<layer>-report-clean`),
#     because upload-artifact rejects duplicate names within one run.
#   - Fixture scans must not pick up this repository's own scanner config:
#     pass the layer's config opt-out (secrets: `config-path: none`).
#   - Every caller job grants `contents: read` and `security-events: write`.
#
# The `test-scripts` job covers what the fixtures cannot: failure paths of the
# parse/enforce scripts (missing report, invalid report, enforce vs report).
# Add equivalent assertions when a new layer introduces its own scripts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- secrets
  call-secrets-vulnerable:
    # security-events: write is required because the called workflow declares it
    # (used only when upload-sarif is true).
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/secrets.yml
    with:
      mode: report
      scan-path: fixtures/vulnerable/secrets
      artifact-name: secrets-report-vulnerable
      config-path: none

  call-secrets-clean:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/secrets.yml
    with:
      mode: report
      scan-path: fixtures/clean/secrets
      artifact-name: secrets-report-clean
      config-path: none

  assert-secrets:
    needs: [call-secrets-vulnerable, call-secrets-clean]
    runs-on: ubuntu-latest
    env:
      VULNERABLE_BLOCKING: ${{ needs.call-secrets-vulnerable.outputs.blocking-count }}
      CLEAN_BLOCKING: ${{ needs.call-secrets-clean.outputs.blocking-count }}
    steps:
      - name: Assert expected counts
        run: |
          set -euo pipefail
          fail=0
          echo "vulnerable blocking-count: '$VULNERABLE_BLOCKING' (expected >= 1)"
          echo "clean blocking-count:      '$CLEAN_BLOCKING' (expected 0)"
          case "$VULNERABLE_BLOCKING" in ''|*[!0-9]*) echo "::error::vulnerable blocking-count is not numeric"; fail=1 ;;
            *) [ "$VULNERABLE_BLOCKING" -ge 1 ] || { echo "::error::Gitleaks found nothing in the vulnerable fixture (false green)"; fail=1; } ;;
          esac
          case "$CLEAN_BLOCKING" in ''|*[!0-9]*) echo "::error::clean blocking-count is not numeric"; fail=1 ;;
            *) [ "$CLEAN_BLOCKING" -eq 0 ] || { echo "::error::Gitleaks reported findings in the clean fixture"; fail=1; } ;;
          esac
          exit "$fail"

  # Failure-path tests for the scripts embedded in secrets.yml. The scripts are
  # extracted by step id and run with simulated inputs.
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test parse and enforce scripts
        run: |
          set -euo pipefail
          wf=.github/workflows/secrets.yml
          work="$(mktemp -d)"
          extract() { yq ".jobs.gitleaks.steps[] | select(.id == \"$1\") | .run" "$wf" > "$work/$1.sh"; [ -s "$work/$1.sh" ] || { echo "::error::step '$1' not found in $wf"; exit 1; }; }
          extract parse
          extract enforce

          failures=0
          expect() { # expected-exit-is-zero(yes|no) description command...
            want="$1"; desc="$2"; shift 2
            if "$@" > "$work/out.log" 2>&1; then got=yes; else got=no; fi
            if [ "$got" = "$want" ]; then echo "ok   - $desc"; else echo "::error::FAIL - $desc (exit-zero expected: $want)"; cat "$work/out.log"; failures=$((failures + 1)); fi
          }

          # (a) report missing -> parse must fail
          mkdir -p "$work/a"
          expect no "parse fails when the report is missing"             env RUNNER_TEMP="$work/a" GITHUB_OUTPUT="$work/a.out" bash "$work/parse.sh"

          # (b) report is not a JSON array -> parse must fail
          mkdir -p "$work/b/gitleaks-out"; echo '{"error": true}' > "$work/b/gitleaks-out/gitleaks.json"
          expect no "parse fails when the report is not a JSON array"             env RUNNER_TEMP="$work/b" GITHUB_OUTPUT="$work/b.out" bash "$work/parse.sh"

          # sanity: a valid empty report parses to zero findings
          mkdir -p "$work/ok/gitleaks-out"; echo '[]' > "$work/ok/gitleaks-out/gitleaks.json"
          expect yes "parse succeeds on a valid empty report"             env RUNNER_TEMP="$work/ok" GITHUB_OUTPUT="$work/ok.out" bash "$work/parse.sh"
          grep -qx 'blocking-count=0' "$work/ok.out" || { echo "::error::expected blocking-count=0"; failures=$((failures + 1)); }

          # (c) enforce with findings -> must fail; (d) report with findings -> must pass
          expect no  "enforce fails in enforce mode with blocking findings" env MODE=enforce BLOCKING=2 bash "$work/enforce.sh"
          expect yes "enforce passes in report mode with blocking findings" env MODE=report BLOCKING=2 bash "$work/enforce.sh"
          expect yes "enforce passes in enforce mode without findings" env MODE=enforce BLOCKING=0 bash "$work/enforce.sh"

          exit "$failures"
