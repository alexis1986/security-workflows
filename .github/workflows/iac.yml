name: iac

# Reusable workflow: infrastructure-as-code scanning with Trivy `config`.
#
# - Scans Dockerfiles, Kubernetes manifests, Terraform, CloudFormation, ... under
#   `scan-path` (a directory).
# - Optional `helm-chart`: the chart is rendered with `helm template` (default
#   values; the chart must render without extra input and its dependencies must
#   be vendored) and the rendered manifests are scanned too. Findings are
#   reported against the chart path.
# - total-count    : misconfigurations of every severity.
# - blocking-count : CRITICAL or HIGH misconfigurations. Misconfigurations have no
#                    "fixed version", so every CRITICAL/HIGH finding blocks.
# - Ignore file: by default the consumer's '.trivyignore' inside `scan-path` is
#   used when it exists, otherwise the one at the repository root (see
#   `ignore-path`). Give every entry a comment with the reason and an expiry.
#
# Permissions: the job declares `security-events: write` (needed only for SARIF
# upload). GitHub rejects a call whose caller grants less than the called
# workflow requests, so every caller job must grant:
#
#   permissions:
#     contents: read
#     security-events: write
#
# SARIF is skipped (with a warning) on fork PRs and Dependabot runs, and an
# upload failure (e.g. no code scanning available) never fails the job.

on:
  workflow_call:
    inputs:
      mode:
        description: "report (never fails on findings) or enforce (fails on blocking findings)"
        type: string
        default: report
      scan-path:
        description: "Directory to scan, relative to the repository root"
        type: string
        default: "."
      upload-sarif:
        description: "Upload a SARIF report to GitHub code scanning (needs security-events: write)"
        type: boolean
        default: false
      artifact-name:
        description: "Name of the uploaded report artifact. Must be unique per run when the workflow is called more than once. Also used as the SARIF category"
        type: string
        default: iac-report
      ignore-path:
        description: "Trivy ignore file relative to the repository root. Empty: use .trivyignore in scan-path, else at the root, if present. 'none': ignore any .trivyignore"
        type: string
        default: ""
      helm-chart:
        description: "Optional Helm chart directory (contains Chart.yaml), relative to the repository root. Rendered with 'helm template' and scanned together with scan-path"
        type: string
        default: ""
    outputs:
      blocking-count:
        description: "Number of CRITICAL/HIGH misconfigurations"
        value: ${{ jobs.trivy.outputs.blocking-count }}
      total-count:
        description: "Total number of misconfigurations (all severities)"
        value: ${{ jobs.trivy.outputs.total-count }}

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      blocking-count: ${{ steps.parse.outputs.blocking-count }}
      total-count: ${{ steps.parse.outputs.total-count }}
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c # v0.76.1
      MODE: ${{ inputs.mode }}
      SCAN_PATH: ${{ inputs.scan-path }}
      IGNORE_PATH: ${{ inputs.ignore-path }}
      HELM_CHART: ${{ inputs.helm-chart }}
    steps:
      - name: Validate inputs
        id: validate
        run: |
          set -euo pipefail
          case "$MODE" in
            report|enforce) ;;
            *) echo "::error::Invalid mode '$MODE' (expected 'report' or 'enforce')"; exit 1 ;;
          esac
          case "$SCAN_PATH" in
            /*|*..*) echo "::error::scan-path must be relative to the repository root and must not contain '..'"; exit 1 ;;
            "") echo "::error::scan-path must not be empty"; exit 1 ;;
          esac
          case "$IGNORE_PATH" in
            /*|*..*) echo "::error::ignore-path must be relative to the repository root and must not contain '..'"; exit 1 ;;
          esac
          case "$HELM_CHART" in
            /*|*..*) echo "::error::helm-chart must be relative to the repository root and must not contain '..'"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        if: ${{ inputs.helm-chart != '' }}
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.1

      - name: Decide SARIF
        id: sarif
        env:
          WANT_SARIF: ${{ inputs.upload-sarif }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          enabled=false
          if [ "$WANT_SARIF" = "true" ]; then
            if [ "$IS_FORK_PR" = "true" ] || [ "$ACTOR" = "dependabot[bot]" ]; then
              echo "::warning::SARIF upload skipped: fork and Dependabot runs have a read-only token."
            else
              enabled=true
            fi
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Run Trivy
        id: scan
        env:
          SARIF_ENABLED: ${{ steps.sarif.outputs.enabled }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/trivy-out"
          mkdir -p "$out"

          if [ ! -d "$GITHUB_WORKSPACE/$SCAN_PATH" ]; then
            echo "::error::scan-path '$SCAN_PATH' does not exist in the repository or is not a directory"
            exit 1
          fi

          ignore=()
          case "$IGNORE_PATH" in
            none) ;;
            "")
              if [ -f "$GITHUB_WORKSPACE/$SCAN_PATH/.trivyignore" ]; then
                ignore=(--ignorefile "/repo/$SCAN_PATH/.trivyignore")
              elif [ -f "$GITHUB_WORKSPACE/.trivyignore" ]; then
                ignore=(--ignorefile /repo/.trivyignore)
              fi ;;
            *)
              if [ ! -f "$GITHUB_WORKSPACE/$IGNORE_PATH" ]; then
                echo "::error::ignore-path '$IGNORE_PATH' does not exist in the repository"
                exit 1
              fi
              ignore=(--ignorefile "/repo/$IGNORE_PATH") ;;
          esac

          # Full report (all severities); the blocking policy is applied when parsing.
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$out:/out" \
            "$TRIVY_IMAGE" \
            config \
            --exit-code 0 \
            "${ignore[@]}" \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output /out/trivy.json \
            "/repo/$SCAN_PATH"

          # Targets are relative to the scanned directory; make them
          # repository-relative so the report, the summary and the SARIF all
          # point at real files.
          prefix="${SCAN_PATH#./}"
          prefix="${prefix%/}"
          if [ "$prefix" = "." ] || [ -z "$prefix" ]; then prefix=""; fi

          helm_json="$RUNNER_TEMP/helm-scan/helm.json"
          hprefix=""
          if [ -n "$HELM_CHART" ]; then
            hprefix="${HELM_CHART#./}"
            hprefix="${hprefix%/}"
            if [ ! -f "$GITHUB_WORKSPACE/$hprefix/Chart.yaml" ]; then
              echo "::error::helm-chart '$HELM_CHART' does not contain a Chart.yaml"
              exit 1
            fi
            rendered="$RUNNER_TEMP/helm-rendered"
            mkdir -p "$rendered" "$RUNNER_TEMP/helm-scan"
            if ! helm template "$GITHUB_WORKSPACE/$hprefix" --output-dir "$rendered" > /dev/null; then
              echo "::error::helm template failed for '$HELM_CHART' (the chart must render with its default values and have its dependencies vendored)"
              exit 1
            fi
            docker run --rm \
              -v "$rendered:/helm:ro" \
              -v "$RUNNER_TEMP/helm-scan:/out" \
              "$TRIVY_IMAGE" \
              config \
              --exit-code 0 \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --format json \
              --output /out/helm.json \
              /helm
          fi

          norm="$RUNNER_TEMP/trivy-norm.json"
          if [ -n "$HELM_CHART" ] && [ -f "$helm_json" ]; then
            # Rendered manifests live under <chart name>/...; map them back to
            # the chart directory in the repository.
            jq --slurpfile h "$helm_json" --arg p "$prefix" --arg hc "$hprefix" '
              .Results = ([(.Results // [])[] | .Target |= (if $p == "" then . else $p + "/" + . end)]
                + [($h[0].Results // [])[] | .Target |= ($hc + "/" + sub("^[^/]+/"; ""))])
            ' "$out/trivy.json" > "$norm"
          else
            jq --arg p "$prefix" '
              .Results = [(.Results // [])[] | .Target |= (if $p == "" then . else $p + "/" + . end)]
            ' "$out/trivy.json" > "$norm"
          fi
          mv "$norm" "$out/trivy.json"

          if [ "$SARIF_ENABLED" = "true" ]; then
            # SARIF from the same scan (no second run). Same content policy as the
            # JSON report: every severity is uploaded.
            docker run --rm \
              -v "$out:/out" \
              "$TRIVY_IMAGE" \
              convert \
              --format sarif \
              --output /out/trivy.sarif \
              /out/trivy.json
          fi

      - name: Make SARIF paths repository-relative
        id: sarif-paths
        if: ${{ steps.sarif.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          sarif="$RUNNER_TEMP/trivy-out/trivy.sarif"
          # Targets in the JSON report are already repository-relative; Trivy
          # still sets a uriBaseId that code scanning cannot resolve, so drop it.
          # Fail if a location is not repository-relative.
          tmp="$sarif.tmp"
          jq '
            (.runs[]?.results[]?.locations[]?.physicalLocation.artifactLocation) |= del(.uriBaseId)
          ' "$sarif" > "$tmp"
          if jq -e '[.runs[]?.results[]?.locations[]?.physicalLocation.artifactLocation.uri // empty | select(startswith("/"))] | length > 0' "$tmp" > /dev/null; then
            echo "::error::SARIF contains absolute paths; refusing to upload."
            exit 1
          fi
          mv "$tmp" "$sarif"

      - name: Parse report
        id: parse
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/trivy-out/trivy.json"

          # Never report zero findings when the scan produced no report.
          if [ ! -f "$report" ]; then
            echo "::error::Trivy report not found at $report. The scan did not run or failed to write its output; refusing to report 0 findings."
            exit 1
          fi
          if ! jq -e 'type == "object" and has("SchemaVersion") and ((.Results // []) | type == "array")' "$report" > /dev/null; then
            echo "::error::Trivy report is not a valid Trivy JSON document; refusing to report 0 findings."
            exit 1
          fi

          total="$(jq '[.Results[]?.Misconfigurations[]?] | length' "$report")"
          # Blocking: CRITICAL/HIGH (misconfigurations have no fixed version).
          blocking="$(jq '[.Results[]?.Misconfigurations[]?
            | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' "$report")"
          echo "total-count=$total" >> "$GITHUB_OUTPUT"
          echo "blocking-count=$blocking" >> "$GITHUB_OUTPUT"

      - name: Job summary
        id: summary
        if: ${{ !cancelled() && steps.parse.outcome == 'success' }}
        env:
          TOTAL: ${{ steps.parse.outputs.total-count }}
          BLOCKING: ${{ steps.parse.outputs.blocking-count }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/trivy-out/trivy.json"
          safe_path="$(printf '%s' "$SCAN_PATH" | tr -c 'A-Za-z0-9_./-' '?')"
          {
            echo "## Infrastructure as code (Trivy)"
            echo
            echo "Scan: \`$safe_path\` | Mode: \`$MODE\`"
            echo
            echo "| Tool | Severity | Count |"
            echo "|---|---|---|"
            jq -r '[.Results[]?.Misconfigurations[]?] as $v
              | ("CRITICAL","HIGH","MEDIUM","LOW","UNKNOWN") as $s
              | "| Trivy | \($s) | \([$v[] | select(.Severity == $s)] | length) |"' "$report"
            echo "| Trivy | **Blocking** (CRITICAL/HIGH) | $BLOCKING |"
            if [ "$TOTAL" -gt 0 ]; then
              echo
              echo "### Top 10 findings"
              echo
              echo "| ID | Severity | Title | Target |"
              echo "|---|---|---|---|"
              jq -r 'def esc: gsub("(?<c>[|`])"; "\\" + .c);
                def rank: {"CRITICAL": 0, "HIGH": 1, "MEDIUM": 2, "LOW": 3}[.] // 4;
                [.Results[]? | .Target as $t | .Misconfigurations[]? | . + {target: $t}]
                | sort_by(.Severity | rank)
                | .[:10][]
                | "| \((.ID // "-") | esc) | \(.Severity | esc) | \((.Title // "-") | esc) | \((.target // "-") | esc) |"' "$report"
              if [ "$TOTAL" -gt 10 ]; then
                echo
                echo "_$((TOTAL - 10)) more in the \`$ARTIFACT_NAME\` artifact._"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: ${{ !cancelled() && steps.parse.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/trivy-out/
          if-no-files-found: error

      - name: Upload SARIF to code scanning
        id: upload-sarif
        if: ${{ !cancelled() && steps.parse.outcome == 'success' && steps.sarif.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/trivy-out/trivy.sarif
          category: ${{ inputs.artifact-name }}

      - name: Warn if SARIF upload failed
        if: ${{ steps.upload-sarif.outcome == 'failure' }}
        run: echo "::warning::SARIF upload failed (code scanning may be unavailable for this repository or token). The scan result is not affected."

      - name: Enforce policy
        id: enforce
        if: ${{ !cancelled() && steps.parse.outcome == 'success' }}
        env:
          BLOCKING: ${{ steps.parse.outputs.blocking-count }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "enforce" ] && [ "$BLOCKING" -gt 0 ]; then
            echo "::error::$BLOCKING blocking finding(s): CRITICAL/HIGH misconfigurations. See the job summary and the report artifact."
            exit 1
          fi
          echo "Mode '$MODE': $BLOCKING blocking finding(s)."
