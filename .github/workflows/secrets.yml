name: secrets

# Reusable workflow: secret scanning with Gitleaks.
#
# - scan-path '.'  -> scans the full git history (checkout with fetch-depth 0).
# - any other path -> scans that directory only (no history).
# - Findings are always redacted; the raw secret never reaches logs, summary
#   or the uploaded report.
# - Any secret is a blocking finding: blocking-count == total-count.
# - Config: Gitleaks auto-loads '.gitleaks.toml' from the scan root, and the
#   consumer's '.gitleaksignore' (repo root) is always honoured.

on:
  workflow_call:
    inputs:
      mode:
        description: "report (never fails on findings) or enforce (fails on blocking findings)"
        type: string
        default: report
      scan-path:
        description: "Path to scan, relative to the repository root. '.' scans the full git history"
        type: string
        default: "."
      upload-sarif:
        description: "Upload a SARIF report to GitHub code scanning (needs security-events: write)"
        type: boolean
        default: false
    outputs:
      blocking-count:
        description: "Number of blocking findings (any secret)"
        value: ${{ jobs.gitleaks.outputs.blocking-count }}
      total-count:
        description: "Total number of findings"
        value: ${{ jobs.gitleaks.outputs.total-count }}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      blocking-count: ${{ steps.parse.outputs.blocking-count }}
      total-count: ${{ steps.parse.outputs.total-count }}
    env:
      GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
      MODE: ${{ inputs.mode }}
      SCAN_PATH: ${{ inputs.scan-path }}
      UPLOAD_SARIF: ${{ inputs.upload-sarif }}
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          case "$MODE" in
            report|enforce) ;;
            *) echo "::error::Invalid mode '$MODE' (expected 'report' or 'enforce')"; exit 1 ;;
          esac
          case "$SCAN_PATH" in
            /*|*..*) echo "::error::scan-path must be relative to the repository root and must not contain '..'"; exit 1 ;;
            "") echo "::error::scan-path must not be empty"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.scan-path == '.' && '0' || '1' }}
          persist-credentials: false

      - name: Run Gitleaks
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gitleaks-out"
          mkdir -p "$out"

          if [ "$SCAN_PATH" = "." ]; then
            subcommand=(git /repo)
          else
            if [ ! -e "$GITHUB_WORKSPACE/$SCAN_PATH" ]; then
              echo "::error::scan-path '$SCAN_PATH' does not exist in the repository"
              exit 1
            fi
            subcommand=(dir "/repo/$SCAN_PATH")
          fi

          run_gitleaks() {
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/repo:ro" \
              -v "$out:/out" \
              -e GIT_CONFIG_COUNT=1 \
              -e GIT_CONFIG_KEY_0=safe.directory \
              -e GIT_CONFIG_VALUE_0=/repo \
              "$GITLEAKS_IMAGE" \
              "${subcommand[@]}" \
              --redact \
              --gitleaks-ignore-path /repo \
              --exit-code 0 \
              --no-banner \
              "$@"
          }

          run_gitleaks --report-format json --report-path /out/gitleaks.json
          if [ "$UPLOAD_SARIF" = "true" ]; then
            run_gitleaks --report-format sarif --report-path /out/gitleaks.sarif
          fi

      - name: Parse report
        id: parse
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks-out/gitleaks.json"

          # Never report zero findings when the scan produced no report.
          if [ ! -f "$report" ]; then
            echo "::error::Gitleaks report not found at $report. The scan did not run or failed to write its output; refusing to report 0 findings."
            exit 1
          fi
          if ! jq -e 'type == "array"' "$report" > /dev/null; then
            echo "::error::Gitleaks report is not a valid JSON array; refusing to report 0 findings."
            exit 1
          fi

          total="$(jq 'length' "$report")"
          # Every detected secret is blocking.
          echo "total-count=$total" >> "$GITHUB_OUTPUT"
          echo "blocking-count=$total" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: ${{ !cancelled() && steps.parse.outcome == 'success' }}
        env:
          TOTAL: ${{ steps.parse.outputs.total-count }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks-out/gitleaks.json"
          {
            echo "## Secrets (Gitleaks)"
            echo
            echo "Scan: \`$SCAN_PATH\` | Mode: \`$MODE\`"
            echo
            echo "| Tool | Severity | Count |"
            echo "|---|---|---|"
            echo "| Gitleaks | Blocking (any secret) | $TOTAL |"
            if [ "$TOTAL" -gt 0 ]; then
              echo
              echo "### Top 10 findings (values redacted)"
              echo
              echo "| Rule | Location | Commit |"
              echo "|---|---|---|"
              jq -r '.[:10][] |
                "| `\(.RuleID)` | `\(.File | sub("^/repo/"; "") | gsub("[|]"; "&#124;")):\(.StartLine)` | \(if (.Commit // "") == "" then "-" else "`" + .Commit[0:8] + "`" end) |"' "$report"
              if [ "$TOTAL" -gt 10 ]; then
                echo
                echo "_$((TOTAL - 10)) more in the \`secrets-report\` artifact._"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: ${{ !cancelled() && steps.parse.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secrets-report
          path: ${{ runner.temp }}/gitleaks-out/
          if-no-files-found: error

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && steps.parse.outcome == 'success' && inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/gitleaks-out/gitleaks.sarif
          category: gitleaks

      - name: Enforce policy
        if: ${{ !cancelled() && steps.parse.outcome == 'success' }}
        env:
          BLOCKING: ${{ steps.parse.outputs.blocking-count }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "enforce" ] && [ "$BLOCKING" -gt 0 ]; then
            echo "::error::$BLOCKING blocking finding(s): secrets detected. See the job summary and the secrets-report artifact."
            exit 1
          fi
          echo "Mode '$MODE': $BLOCKING blocking finding(s)."
