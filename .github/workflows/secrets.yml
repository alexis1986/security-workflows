name: secrets

# Reusable workflow: secret scanning with Gitleaks.
#
# - scan-path '.'  -> scans the full git history (checkout with fetch-depth 0).
# - any other path -> scans that directory only (no history).
# - Findings are always redacted; the raw secret never reaches logs, summary
#   or the uploaded report.
# - Any secret is a blocking finding: blocking-count == total-count.
# - Config: the consumer's '.gitleaks.toml' at the repository root is used when
#   it exists (see `config-path`), and '.gitleaksignore' at the repo root is
#   always honoured.
#
# Permissions: the job declares `security-events: write` (needed only for SARIF
# upload). GitHub rejects a call whose caller grants less than the called
# workflow requests, so every caller job must grant:
#
#   permissions:
#     contents: read
#     security-events: write
#
# SARIF is skipped (with a warning) on fork PRs and Dependabot runs, and an
# upload failure (e.g. no code scanning available) never fails the job.

on:
  workflow_call:
    inputs:
      mode:
        description: "report (never fails on findings) or enforce (fails on blocking findings)"
        type: string
        default: report
      scan-path:
        description: "Path to scan, relative to the repository root. '.' scans the full git history"
        type: string
        default: "."
      upload-sarif:
        description: "Upload a SARIF report to GitHub code scanning (needs security-events: write)"
        type: boolean
        default: false
      artifact-name:
        description: "Name of the uploaded report artifact. Must be unique per run when the workflow is called more than once. Also used as the SARIF category"
        type: string
        default: secrets-report
      config-path:
        description: "Gitleaks config relative to the repository root. Empty: use .gitleaks.toml at the root if present. 'none': ignore any config and use the Gitleaks defaults"
        type: string
        default: ""
    outputs:
      blocking-count:
        description: "Number of blocking findings (any secret)"
        value: ${{ jobs.gitleaks.outputs.blocking-count }}
      total-count:
        description: "Total number of findings"
        value: ${{ jobs.gitleaks.outputs.total-count }}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      blocking-count: ${{ steps.parse.outputs.blocking-count }}
      total-count: ${{ steps.parse.outputs.total-count }}
    env:
      GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
      MODE: ${{ inputs.mode }}
      SCAN_PATH: ${{ inputs.scan-path }}
      CONFIG_PATH: ${{ inputs.config-path }}
    steps:
      - name: Validate inputs
        id: validate
        run: |
          set -euo pipefail
          case "$MODE" in
            report|enforce) ;;
            *) echo "::error::Invalid mode '$MODE' (expected 'report' or 'enforce')"; exit 1 ;;
          esac
          case "$SCAN_PATH" in
            /*|*..*) echo "::error::scan-path must be relative to the repository root and must not contain '..'"; exit 1 ;;
            "") echo "::error::scan-path must not be empty"; exit 1 ;;
          esac
          case "$CONFIG_PATH" in
            /*|*..*) echo "::error::config-path must be relative to the repository root and must not contain '..'"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.scan-path == '.' && '0' || '1' }}
          persist-credentials: false

      - name: Decide SARIF
        id: sarif
        env:
          WANT_SARIF: ${{ inputs.upload-sarif }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          enabled=false
          if [ "$WANT_SARIF" = "true" ]; then
            if [ "$IS_FORK_PR" = "true" ] || [ "$ACTOR" = "dependabot[bot]" ]; then
              echo "::warning::SARIF upload skipped: fork and Dependabot runs have a read-only token."
            else
              enabled=true
            fi
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Run Gitleaks
        id: scan
        env:
          SARIF_ENABLED: ${{ steps.sarif.outputs.enabled }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/gitleaks-out"
          mkdir -p "$out"

          if [ "$SCAN_PATH" = "." ]; then
            subcommand=(git /repo)
          else
            if [ ! -e "$GITHUB_WORKSPACE/$SCAN_PATH" ]; then
              echo "::error::scan-path '$SCAN_PATH' does not exist in the repository"
              exit 1
            fi
            subcommand=(dir "/repo/$SCAN_PATH")
          fi

          config=()
          case "$CONFIG_PATH" in
            none) ;;
            "")
              if [ -f "$GITHUB_WORKSPACE/.gitleaks.toml" ]; then config=(--config /repo/.gitleaks.toml); fi ;;
            *)
              if [ ! -f "$GITHUB_WORKSPACE/$CONFIG_PATH" ]; then
                echo "::error::config-path '$CONFIG_PATH' does not exist in the repository"
                exit 1
              fi
              config=(--config "/repo/$CONFIG_PATH") ;;
          esac

          run_gitleaks() {
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/repo:ro" \
              -v "$out:/out" \
              -e GIT_CONFIG_COUNT=1 \
              -e GIT_CONFIG_KEY_0=safe.directory \
              -e GIT_CONFIG_VALUE_0=/repo \
              "$GITLEAKS_IMAGE" \
              "${subcommand[@]}" \
              "${config[@]}" \
              --redact \
              --gitleaks-ignore-path /repo \
              --exit-code 0 \
              --no-banner \
              "$@"
          }

          run_gitleaks --report-format json --report-path /out/gitleaks.json
          if [ "$SARIF_ENABLED" = "true" ]; then
            run_gitleaks --report-format sarif --report-path /out/gitleaks.sarif
          fi

      - name: Parse report
        id: parse
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks-out/gitleaks.json"

          # Never report zero findings when the scan produced no report.
          if [ ! -f "$report" ]; then
            echo "::error::Gitleaks report not found at $report. The scan did not run or failed to write its output; refusing to report 0 findings."
            exit 1
          fi
          if ! jq -e 'type == "array"' "$report" > /dev/null; then
            echo "::error::Gitleaks report is not a valid JSON array; refusing to report 0 findings."
            exit 1
          fi

          total="$(jq 'length' "$report")"
          # Every detected secret is blocking.
          echo "total-count=$total" >> "$GITHUB_OUTPUT"
          echo "blocking-count=$total" >> "$GITHUB_OUTPUT"

      - name: Job summary
        id: summary
        if: ${{ !cancelled() && steps.parse.outcome == 'success' }}
        env:
          TOTAL: ${{ steps.parse.outputs.total-count }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/gitleaks-out/gitleaks.json"
          safe_path="$(printf '%s' "$SCAN_PATH" | tr -c 'A-Za-z0-9_./-' '?')"
          {
            echo "## Secrets (Gitleaks)"
            echo
            echo "Scan: \`$safe_path\` | Mode: \`$MODE\`"
            echo
            echo "| Tool | Severity | Count |"
            echo "|---|---|---|"
            echo "| Gitleaks | Blocking (any secret) | $TOTAL |"
            if [ "$TOTAL" -gt 0 ]; then
              echo
              echo "### Top 10 findings (values redacted)"
              echo
              echo "| Rule | Location | Commit |"
              echo "|---|---|---|"
              jq -r 'def esc: gsub("(?<c>[|`])"; "\\" + .c);
                .[:10][] |
                "| \(.RuleID | esc) | \(.File | sub("^/repo/"; "") | esc):\(.StartLine) | \(if (.Commit // "") == "" then "-" else .Commit[0:8] end) |"' "$report"
              if [ "$TOTAL" -gt 10 ]; then
                echo
                echo "_$((TOTAL - 10)) more in the \`$ARTIFACT_NAME\` artifact._"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: ${{ !cancelled() && steps.parse.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/gitleaks-out/
          if-no-files-found: error

      - name: Upload SARIF to code scanning
        id: upload-sarif
        if: ${{ !cancelled() && steps.parse.outcome == 'success' && steps.sarif.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/gitleaks-out/gitleaks.sarif
          category: ${{ inputs.artifact-name }}

      - name: Warn if SARIF upload failed
        if: ${{ steps.upload-sarif.outcome == 'failure' }}
        run: echo "::warning::SARIF upload failed (code scanning may be unavailable for this repository or token). The scan result is not affected."

      - name: Enforce policy
        id: enforce
        if: ${{ !cancelled() && steps.parse.outcome == 'success' }}
        env:
          BLOCKING: ${{ steps.parse.outputs.blocking-count }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "enforce" ] && [ "$BLOCKING" -gt 0 ]; then
            echo "::error::$BLOCKING blocking finding(s): secrets detected. See the job summary and the report artifact."
            exit 1
          fi
          echo "Mode '$MODE': $BLOCKING blocking finding(s)."
